<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Penilaian Kurikulum Merdeka</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f2;--c:#fff;--t:#17221f;--m:#5d6b66;--p:#0f766e;--pt:#fff;--b:#d8dfda;--ok:#15803d;--bad:#b91c1c}
@media(prefers-color-scheme:dark){:root{--bg:#0f1513;--c:#18201d;--t:#e8efec;--m:#97a8a1;--p:#3fb5a8;--pt:#06201c;--b:#2a3631;--ok:#4ade80;--bad:#f87171}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px/1.5 'Plus Jakarta Sans',system-ui,sans-serif}
h1,h2,h3{margin:0 0 .6rem;line-height:1.25}h1{font-size:1.5rem;font-weight:800}h2{font-size:1.15rem}
.wrap{max-width:1000px;margin:0 auto;padding:1rem}
.card{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:1rem;margin-bottom:1rem}
label{display:block;font-weight:600;font-size:.85rem;margin:.7rem 0 .25rem}
input,select,textarea{width:100%;padding:.55rem .65rem;border:1px solid var(--b);border-radius:6px;background:var(--bg);color:var(--t);font:inherit}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--p);outline-offset:1px}
button{font:inherit;font-weight:600;border:0;border-radius:6px;padding:.55rem 1rem;background:var(--p);color:var(--pt);cursor:pointer}
button.g{background:transparent;color:var(--p);border:1px solid var(--b)}button.d{background:transparent;color:var(--bad);padding:.2rem .5rem}
.row{display:flex;gap:.75rem;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
.nav{display:flex;gap:.25rem;flex-wrap:wrap;margin:.75rem 0 1rem;border-bottom:1px solid var(--b)}
.nav button{background:none;color:var(--m);border-radius:6px 6px 0 0;border-bottom:3px solid transparent}.nav button.on{color:var(--p);border-color:var(--p)}
.top{display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap}
.m{color:var(--m);font-size:.85rem}.stat{font-size:1.8rem;font-weight:800;color:var(--p)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.75rem}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{border-bottom:1px solid var(--b);padding:.4rem .5rem;text-align:left;white-space:nowrap}
th{font-size:.8rem;color:var(--m)}td input{width:70px;padding:.3rem}td.n{text-align:center}
.tags{display:flex;flex-wrap:wrap;gap:.3rem;padding:.35rem;border:1px solid var(--b);border-radius:6px;background:var(--bg)}
.tags input{border:0;flex:1;min-width:120px;background:none;padding:.2rem}.chip{background:var(--p);color:var(--pt);border-radius:99px;padding:.1rem .6rem;font-size:.85rem;cursor:pointer}
.bar{height:8px;background:var(--b);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--p)}
.ok{color:var(--ok)}.bad{color:var(--bad)}.pill{padding:.1rem .5rem;border-radius:99px;border:1px solid currentColor;font-size:.8rem}
/* Tabel rekap bergaya spreadsheet */
table.rk th,table.rk td{border:1px solid #9aa5a0}
table.rk th{color:#111;text-align:center;font-weight:700}
table.rk td.n{color:var(--t)}
table.rk td.yl{background:#fff59d;color:#111}table.rk td.cy{background:#b2ebf2;color:#111}
table.rk td.lw{color:#dc2626;font-weight:700}
/* Loading */
#load{position:fixed;inset:0;background:rgba(0,0,0,.38);display:none;align-items:center;justify-content:center;z-index:50}
#load.on{display:flex}
.lb{background:var(--c);color:var(--t);border:1px solid var(--b);border-radius:12px;padding:1.3rem 1.7rem;text-align:center;max-width:320px;box-shadow:0 10px 34px rgba(0,0,0,.3)}
.sp{width:38px;height:38px;border:4px solid var(--b);border-top-color:var(--p);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto .8rem}
@keyframes spin{to{transform:rotate(360deg)}}
#pb{position:fixed;top:0;left:0;right:0;height:3px;overflow:hidden;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
#pb.on{opacity:1}
#pb i{position:absolute;top:0;bottom:0;width:35%;background:var(--p);animation:slide 1s ease-in-out infinite}
@keyframes slide{0%{left:-35%}100%{left:100%}}
@media(prefers-reduced-motion:reduce){.sp{animation-duration:2.5s}#pb i{animation-duration:2.5s}}
#toast{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);background:var(--t);color:var(--bg);padding:.5rem 1rem;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;z-index:70}
#toast.on{opacity:1}
@page{size:landscape}
@media print{.nav,.top button,.noprint,#load,#pb{display:none!important}}
</style>
</head>
<body>
<div id="pb" aria-hidden="true"><i></i></div>
<div class="wrap" id="app"></div>
<div id="load" role="alertdialog" aria-live="polite" aria-busy="true" aria-label="Memuat"><div class="lb"><div class="sp"></div><div id="lmsg">Memuat…</div><div class="m" id="lslow" style="margin-top:.4rem"></div></div></div>
<div id="toast" role="status"></div>
<script>
// === URL Web App dari Apps Script (berakhiran /exec) ===
const API = 'https://script.google.com/macros/s/AKfycbzrkI2XHbYVsOaqtzE4dEYcAHoG6QN6DKAz071P4hMke3HKSehyTHwWxSYoE-5sbGwy/exec';

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
let S = JSON.parse(localStorage.getItem('sess') || '{}'), P = null, D = null, N = {};
let sel = {m:'', k:''}, view = 'dash', kktp = 75, tags = {mapel:[], kelas:[]};

function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.x);toast.x=setTimeout(()=>e.classList.remove('on'),3000)}

/* ---------- Sistem loading ---------- */
// Overlay penuh untuk proses besar; bar tipis di atas layar untuk simpan nilai (tidak menghalangi pengetikan).
let busy = 0, quiet = 0;
function lod(on, msg, q) {
  if (q) { quiet = Math.max(0, quiet + (on ? 1 : -1)); $('#pb').classList.toggle('on', quiet > 0); return; }
  busy = Math.max(0, busy + (on ? 1 : -1));
  if (on && msg) $('#lmsg').textContent = msg;
  $('#load').classList.toggle('on', busy > 0);
  clearTimeout(lod.t); $('#lslow').textContent = '';
  if (busy > 0) lod.t = setTimeout(() => { $('#lslow').textContent = 'Server Google sedang bekerja, mohon tunggu sebentar…'; }, 6000);
}
addEventListener('beforeunload', e => { if (quiet > 0) { e.preventDefault(); e.returnValue = ''; } });
const PESAN = {
  register:'Membuat akun dan spreadsheet periode…', login:'Memeriksa akun…', periodeBaru:'Membuat spreadsheet periode baru…',
  periods:'Memuat daftar periode…', data:'Memuat data penilaian…', adminInfo:'Memuat data admin…', adminRekap:'Menghitung rekap semua guru…',
  adminReset:'Mereset PIN…', bangunRekap:'Memperbarui rekap di spreadsheet…', imporSiswa:'Mengimpor siswa…', imporTP:'Mengimpor TP dan komponen…',
  tambahSiswa:'Menyimpan siswa…', tambahTP:'Menyimpan TP…', hapusTP:'Menghapus TP…', tambahKomponen:'Menyimpan komponen…',
  hapusKomponen:'Menghapus komponen…', simpanBobot:'Menyimpan bobot…', simpanPengaturan:'Menyimpan pengaturan…', ubahTP:'Menyimpan perubahan…', ubahKomponen:'Menyimpan perubahan…'
};
async function api(action, d = {}, o = {}) {
  const q = o.quiet ?? (action === 'nilai');
  lod(true, o.msg || PESAN[action] || 'Memproses…', q);
  const ac = new AbortController(), to = setTimeout(() => ac.abort(), 90000);
  try {
    const r = await fetch(API, {method:'POST', signal:ac.signal, body:JSON.stringify({action, gid:S.gid, pin:S.pin, key:sessionStorage.getItem('adm'), ...d})});
    const j = await r.json(); if (j.error) throw j.error; return j;
  } catch (e) {
    toast(typeof e === 'string' ? e : e && e.name === 'AbortError' ? 'Server terlalu lama merespons. Coba lagi.' : 'Gagal terhubung ke server');
    throw e;
  } finally { clearTimeout(to); lod(false, '', q); }
}

/* ---------- Registrasi & masuk ---------- */
function tagBox(id, label, ph) {
  return `<label>${label}</label><div class="tags" id="tb-${id}"></div><div class="m">${ph}</div>`;
}
function drawTags(id) {
  const b = $('#tb-' + id); if (!b) return;
  b.innerHTML = tags[id].map((t, i) => `<span class="chip" data-i="${i}" title="Klik untuk hapus">${esc(t)} ×</span>`).join('') + `<input aria-label="${id}" placeholder="Ketik lalu Enter">`;
  const inp = b.querySelector('input');
  const add = () => { const v = inp.value.replace(',', '').trim(); if (v && !tags[id].includes(v)) tags[id].push(v); drawTags(id); $('#tb-' + id + ' input').focus(); };
  inp.onkeydown = e => { if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); add(); } };
  inp.onblur = () => { if (inp.value.trim()) add(); };
  b.querySelectorAll('.chip').forEach(c => c.onclick = () => { tags[id].splice(+c.dataset.i, 1); drawTags(id); });
}
function thn() { const y = new Date().getFullYear(), m = new Date().getMonth(); const a = m >= 6 ? y : y - 1; return a + '/' + (a + 1); }
function formPeriode(akun) {
  tags = {mapel:[], kelas:[]};
  const ganjil = new Date().getMonth() >= 6;
  return `${akun ? `<label>Nama lengkap</label><input id="f-nama" autocomplete="name">
  <label>PIN (min. 4 karakter, untuk masuk kembali)</label><input id="f-pin" type="password" autocomplete="new-password">` : ''}
  <div class="row"><div><label>Nama sekolah</label><input id="f-sek" value="${esc(P?.sekolah || '')}"></div>
  <div><label>Jenjang</label><select id="f-jen">${['SD/MI','SMP/MTs','SMA/MA','SMK'].map(j => `<option ${P?.jenjang === j ? 'selected' : ''}>${j}</option>`).join('')}</select></div></div>
  <div class="row"><div><label>Tahun ajaran</label><input id="f-th" value="${thn()}"></div>
  <div><label>Semester</label><select id="f-sem"><option ${ganjil ? 'selected' : ''}>Ganjil</option><option ${ganjil ? '' : 'selected'}>Genap</option></select></div></div>
  ${tagBox('mapel', 'Mata pelajaran yang diampu', 'Bisa lebih dari satu, mis. Matematika, IPA')}
  ${tagBox('kelas', 'Kelas yang diampu', 'Bisa lebih dari satu, mis. 7A, 7B, 8C')}`;
}
function bacaPeriode() {
  return {sekolah:$('#f-sek').value.trim(), jenjang:$('#f-jen').value, tahunAjaran:$('#f-th').value.trim(), semester:$('#f-sem').value, mapel:tags.mapel, kelas:tags.kelas};
}
function showAuth(mode = 'daftar') {
  $('#app').innerHTML = `<div class="card" style="max-width:640px;margin:2rem auto"><h1>Penilaian Kurikulum Merdeka</h1>
  <div class="nav"><button class="${mode === 'daftar' ? 'on' : ''}" id="t1">Registrasi guru</button><button class="${mode === 'masuk' ? 'on' : ''}" id="t2">Sudah terdaftar</button></div>
  <div id="fm"></div><p class="m"><a href="#admin" id="adm">Masuk sebagai admin / wali kelas</a></p></div>`;
  $('#adm').onclick = e => { e.preventDefault(); showAdmin(); };
  $('#t1').onclick = () => showAuth('daftar'); $('#t2').onclick = () => showAuth('masuk');
  if (mode === 'daftar') {
    $('#fm').innerHTML = formPeriode(true) + `<p><button id="go">Daftar dan mulai</button></p>`;
    drawTags('mapel'); drawTags('kelas');
    $('#go').onclick = async () => {
      const r = await api('register', {nama:$('#f-nama').value, pin:$('#f-pin').value, ...bacaPeriode()});
      S = {gid:r.gid, pin:$('#f-pin').value, nama:r.nama}; localStorage.setItem('sess', JSON.stringify(S)); pilihPeriode(r.periods);
    };
  } else {
    $('#fm').innerHTML = `<label>Nama lengkap</label><input id="l-nama"><label>PIN</label><input id="l-pin" type="password"><p><button id="go">Masuk</button></p>`;
    $('#go').onclick = async () => {
      const pin = $('#l-pin').value, r = await api('login', {nama:$('#l-nama').value, pin});
      S = {gid:r.gid, pin, nama:r.nama}; localStorage.setItem('sess', JSON.stringify(S)); pilihPeriode(r.periods);
    };
  }
}

/* ---------- Pilih / buat periode ---------- */
function pilihPeriode(list) {
  $('#app').innerHTML = `<div class="top"><h1>Halo, ${esc(S.nama)}</h1><button class="g" id="out">Keluar</button></div>
  <h2>Pilih periode</h2>${list.map(p => `<div class="card top"><div><b>${esc(p.tahunAjaran)} – ${esc(p.semester)}</b><div class="m">${esc(p.sekolah)} (${esc(p.jenjang)}) · ${p.mapel.map(esc).join(', ')} · Kelas ${p.kelas.map(esc).join(', ')}</div></div><button data-id="${p.id}">Buka</button></div>`).join('')}
  <div class="card"><h2>Registrasi semester / tahun ajaran baru</h2>${formPeriode(false)}<p><button id="go">Daftarkan periode baru</button></p></div>`;
  drawTags('mapel'); drawTags('kelas');
  $('#out').onclick = () => { localStorage.removeItem('sess'); S = {}; showAuth(); };
  document.querySelectorAll('button[data-id]').forEach(b => b.onclick = () => bukaPeriode(list.find(p => p.id === b.dataset.id)));
  $('#go').onclick = async () => { const r = await api('periodeBaru', bacaPeriode()); toast('Periode terdaftar'); pilihPeriode(r.periods); };
}
async function bukaPeriode(p) {
  const d = await api('data', {pid:p.id});
  P = p; D = d; N = {};
  D.nilai.forEach(n => N[n.itemId + '|' + n.siswaId] = n.nilai);
  kktp = D.bobot.kktp ?? 75;
  sel = {m:p.mapel[0], k:p.kelas[0]}; view = 'dash'; render();
}

/* ---------- Kerangka aplikasi ---------- */
const MENU = {dash:'Dashboard', input:'Input nilai', rekap:'Rekapitulasi', progres:'Progres siswa'};
function render() {
  $('#app').innerHTML = `<div class="top"><div><h1>${esc(P.sekolah)}</h1><div class="m">${esc(P.tahunAjaran)} · Semester ${esc(P.semester)} · ${esc(S.nama)}</div></div>
  <button class="g" id="ganti">Ganti periode</button></div>
  <div class="nav">${Object.entries(MENU).map(([k, v]) => `<button data-v="${k}" class="${view === k ? 'on' : ''}">${v}</button>`).join('')}</div><div id="v"></div>`;
  document.querySelectorAll('.nav button').forEach(b => b.onclick = () => { view = b.dataset.v; render(); });
  $('#ganti').onclick = async () => pilihPeriode((await api('periods')).periods);
  ({dash:vDash, input:vInput, rekap:vRekap, progres:vProgres})[view]();
}
const tpList = (m = sel.m, k = sel.k) => D.tp.filter(t => t.mapel === m && t.kelas === k);
const siswaList = (k = sel.k) => D.siswa.filter(s => s.kelas === k).sort((a, b) => a.nama.localeCompare(b.nama));
const nl = (t, s) => { const v = N[t + '|' + s]; return v === '' || v === undefined ? null : Number(v); };
// Format angka gaya Indonesia (koma desimal), maksimal 2 desimal
const f1 = x => x === null || x === undefined ? '–' : Number(x).toLocaleString('id-ID', {maximumFractionDigits:2});
function picker(extra = '') {
  return `<div class="row noprint"><div><label>Mata pelajaran</label><select id="sm">${P.mapel.map(m => `<option ${m === sel.m ? 'selected' : ''}>${esc(m)}</option>`).join('')}</select></div>
  <div><label>Kelas</label><select id="sk">${P.kelas.map(k => `<option ${k === sel.k ? 'selected' : ''}>${esc(k)}</option>`).join('')}</select></div>${extra}</div>`;
}
function bindPicker() { $('#sm').onchange = e => { sel.m = e.target.value; render(); }; $('#sk').onchange = e => { sel.k = e.target.value; render(); }; }

/* ---------- Perhitungan nilai ---------- */
// Total TP = tugas (rata-rata komponen) x bobot + PH x bobot. Rapor = rata-rata Total TP x bobot + PSAS x bobot.
// Bagian yang belum diisi tidak dihitung (bobot dinormalkan ulang).
const psasId = (m, k) => 'psas§' + m + '§' + k;
const bobotFor = (m = sel.m, k = sel.k) => D.khusus[m + '§' + k] || D.bobot;
const kompOf = id => D.komp.filter(x => x.tpId === id);
const gabung = a => { const v = a.filter(x => x[0] !== null), w = v.reduce((q, x) => q + x[1], 0); return w ? v.reduce((q, x) => q + x[0] * x[1], 0) / w : null; };
function hitung(sid, m = sel.m, k = sel.k) {
  const b = bobotFor(m, k);
  const hs = tpList(m, k).map(t => {
    const tugas = avg(kompOf(t.id).map(c => nl(c.id, sid)).filter(v => v !== null)), ph = nl('ph:' + t.id, sid);
    return {tugas, ph, total:gabung([[tugas, b.tugas], [ph, b.ph]])};
  });
  const at = avg(hs.map(h => h.total).filter(v => v !== null)), psas = nl(psasId(m, k), sid);
  let rp = gabung([[at, b.tp], [psas, b.psas]]); if (rp !== null && b.bulat) rp = Math.round(rp);
  return {hs, at, psas, rapor:rp};
}

/* ---------- Dashboard ---------- */
function vDash() {
  const rows = P.mapel.flatMap(m => P.kelas.map(k => {
    const t = tpList(m, k), s = siswaList(k);
    const items = t.flatMap(x => kompOf(x.id).map(c => c.id).concat('ph:' + x.id)).concat(psasId(m, k));
    const tot = items.length * s.length, isi = items.reduce((a, it) => a + s.filter(y => nl(it, y.id) !== null).length, 0);
    return {m, k, t:t.length, s:s.length, pct:tot ? Math.round(isi / tot * 100) : 0, avg:avg(s.map(y => hitung(y.id, m, k).rapor).filter(v => v !== null))};
  }));
  $('#v').innerHTML = `<div class="grid"><div class="card"><div class="stat">${P.mapel.length}</div>Mata pelajaran</div><div class="card"><div class="stat">${P.kelas.length}</div>Kelas</div>
  <div class="card"><div class="stat">${D.tp.length}</div>TP / Bab / Tema</div><div class="card"><div class="stat">${D.siswa.length}</div>Siswa</div></div>
  <div class="card sc"><h2>Ringkasan per mapel dan kelas</h2><table><tr><th>Mapel</th><th>Kelas</th><th>TP</th><th>Siswa</th><th>Kelengkapan nilai</th><th>Rata-rata nilai rapor</th></tr>
  ${rows.map(x => `<tr><td>${esc(x.m)}</td><td>${esc(x.k)}</td><td>${x.t}</td><td>${x.s}</td><td style="min-width:140px"><div class="bar"><i style="width:${x.pct}%"></i></div><span class="m">${x.pct}%</span></td><td>${f1(x.avg)}</td></tr>`).join('')}</table></div>`;
}

/* ---------- Input nilai ---------- */
function vInput() {
  const t = tpList(), s = siswaList(), b = bobotFor(), H = {};
  const inp = (item, sid) => `<td><input type="number" min="0" max="100" inputmode="decimal" data-i="${esc(item)}" data-s="${sid}" value="${nl(item, sid) ?? ''}"></td>`;
  $('#v').innerHTML = `<div class="card">${picker()}</div>
  <div class="card"><h2>Bobot penilaian · ${esc(sel.m)} kelas ${esc(sel.k)}</h2>
  <p class="m">${D.khusus[sel.m + '§' + sel.k] ? 'Memakai bobot khusus untuk mapel dan kelas ini.' : 'Memakai bobot bawaan periode (berlaku untuk mapel dan kelas yang belum punya bobot khusus).'}</p><div class="row">
  <div><label>Nilai tugas (%)</label><input type="number" id="bt" min="0" max="100" value="${b.tugas}"></div>
  <div><label>Penilaian harian / PH (%)</label><input type="number" id="bp" min="0" max="100" value="${b.ph}"></div>
  <div><label>Rata-rata TP (%)</label><input type="number" id="btp" min="0" max="100" value="${b.tp}"></div>
  <div><label>PSAS (%)</label><input type="number" id="bs" min="0" max="100" value="${b.psas}"></div></div>
  <p class="m">Nilai Total TP = rata-rata tugas × ${b.tugas}% + PH × ${b.ph}%. Nilai Rapor = rata-rata Nilai Total TP × ${b.tp}% + PSAS × ${b.psas}%. Mengubah satu bobot otomatis menyesuaikan pasangannya (jumlah 100).</p>
  <label style="display:flex;gap:.5rem;align-items:center;font-weight:400"><input type="checkbox" id="bl" style="width:auto" ${b.bulat ? 'checked' : ''}> Bulatkan Nilai Rapor menjadi bilangan bulat</label>
  <p><button id="bsk">Simpan untuk mapel &amp; kelas ini</button> <button class="g" id="bsv">Simpan sebagai bawaan semua</button> ${D.khusus[sel.m + '§' + sel.k] ? '<button class="g" id="bsr">Kembali ke bawaan</button>' : ''}</p></div>
  <div class="card"><h2>TP / Bab / Tema dan komponen nilai</h2>
  ${t.map((x, i) => `<div style="border-top:1px solid var(--b);padding:.6rem 0"><div class="top"><b>${i + 1}. ${esc(x.judul)}</b><span><button class="g" data-et="${x.id}">Ubah</button> <button class="d" data-del="${x.id}">Hapus TP</button></span></div>
  <div style="margin:.3rem 0">${kompOf(x.id).map(c => `<span class="chip"><span data-ek="${c.id}" title="Klik untuk mengubah nama">${esc(c.nama)}</span> <span data-dk="${c.id}" title="Hapus komponen">×</span></span>`).join(' ') || '<span class="m">Belum ada komponen nilai (tugas, proyek, praktik, dll).</span>'}</div>

/* ---------- Impor dari Excel (siswa & TP) ---------- */
const nrm = x => String(x ?? '').trim().toLowerCase();
const cari = (h, re) => h.findIndex(x => re.test(x));
const cocok = (list, v) => list.find(x => nrm(x) === nrm(v));
async function bacaSheet(f) {
  lod(true, 'Membaca file Excel…');
  try {
    const wb = XLSX.read(await f.arrayBuffer(), {type:'array'});
    return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, defval:''});
  } finally { lod(false); }
}
function buatTemplate(nama, rows, lebar, petunjuk) {
  if (!window.XLSX) return toast('Pustaka Excel belum termuat. Periksa koneksi internet.');
  const wb = XLSX.utils.book_new(), ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = lebar.map(w => ({wch:w})); XLSX.utils.book_append_sheet(wb, ws, 'Data');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['Petunjuk'], ...petunjuk.map(x => [x])]), 'Petunjuk');
  XLSX.writeFile(wb, nama);
}
function unduhTemplate() {

}
function unduhTemplateTP() {

    [sel.m, sel.k, 'Contoh: Bab 1 - Bilangan bulat', 'Tugas 1'], [sel.m, sel.k, 'Contoh: Bab 1 - Bilangan bulat', 'Proyek'], [sel.m, sel.k, 'Contoh: Bab 2 - Pecahan', 'Praktik']], [22, 10, 45, 28],
    ['1. Mapel: ' + P.mapel.join(', '), '2. Kelas: ' + P.kelas.join(', '), '3. Mapel/Kelas boleh kosong = pilihan yang sedang aktif di aplikasi.', '4. Satu baris = satu komponen nilai (tugas, proyek, praktik, dll). Tulis judul TP yang sama di beberapa baris untuk menambah komponen. Beberapa komponen juga boleh dalam satu sel, dipisah titik koma (;).', '5. Kolom Komponen Nilai boleh kosong jika hanya ingin membuat TP.', '6. PH dan PSAS tidak perlu dibuat sebagai komponen; keduanya sudah tersedia otomatis.', '7. Hapus baris contoh, simpan, lalu pilih file di Input nilai > Impor TP.']);

async function imporExcel(e) {
  const f = e.target.files[0]; if (!f) return;
  if (!window.XLSX) return toast('Pustaka Excel belum termuat. Periksa koneksi internet.');
  const raw = await bacaSheet(f), h = (raw[0] || []).map(nrm);
  const ik = cari(h, /kelas/), inis = cari(h, /^nisn?\b/), inm = cari(h, /nama/), ijk = cari(h, /jenis|kelamin|^jk/);
  if (inm < 0) return toast('Kolom "Nama Siswa" tidak ditemukan. Gunakan template.');
  const daftar = []; let lewat = 0;
  raw.slice(1).forEach(r => {
    const nama = String(r[inm] ?? '').trim(); if (!nama || /^contoh:/i.test(nama)) return;
    const kv = ik >= 0 ? String(r[ik] ?? '').trim() : '', kelas = kv ? cocok(P.kelas, kv) : sel.k;
    if (!kelas) { lewat++; return; }
    daftar.push({kelas, nama, nis:inis >= 0 ? String(r[inis] ?? '').trim() : '', jk:ijk >= 0 ? String(r[ijk] ?? '') : ''});
  });
  if (!daftar.length) return toast('Tidak ada siswa yang valid' + (lewat ? ' (' + lewat + ' baris berkelas tidak dikenal)' : ''));
  const r = await api('imporSiswa', {pid:P.id, daftar}); D.siswa.push(...r.siswa);
  const dobel = daftar.length - r.siswa.length;
  toast(r.siswa.length + ' siswa diimpor' + (dobel ? ', ' + dobel + ' sudah ada' : '') + (lewat ? ', ' + lewat + ' dilewati (kelas tidak dikenal)' : '')); vInput();
}
async function imporTP(e) {
  const f = e.target.files[0]; if (!f) return;
  if (!window.XLSX) return toast('Pustaka Excel belum termuat. Periksa koneksi internet.');
  const raw = await bacaSheet(f), h = (raw[0] || []).map(nrm);
  const im = cari(h, /mapel/), ik = cari(h, /kelas/), ij = cari(h, /tujuan|judul|bab|tema|^tp/), ikp = cari(h, /komponen/);
  if (ij < 0) return toast('Kolom "Tujuan Pembelajaran / Judul Bab" tidak ditemukan. Gunakan template.');
  const daftar = []; let lewat = 0;
  raw.slice(1).forEach(r => {
    const judul = String(r[ij] ?? '').trim(); if (!judul || /^contoh:/i.test(judul)) return;
    const mv = im >= 0 ? String(r[im] ?? '').trim() : '', kv = ik >= 0 ? String(r[ik] ?? '').trim() : '';
    const mapel = mv ? cocok(P.mapel, mv) : sel.m, kelas = kv ? cocok(P.kelas, kv) : sel.k;
    if (!mapel || !kelas) { lewat++; return; }

  });
  if (!daftar.length) return toast('Tidak ada data valid' + (lewat ? ' (' + lewat + ' baris dengan mapel/kelas tidak dikenal)' : ''));

  return `<svg width="110" height="32" viewBox="-4 0 108 32" aria-hidden="true"><polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="var(--p)" stroke-width="2"/><circle cx="${pts.at(-1)[0]}" cy="${pts.at(-1)[1]}" r="3" fill="var(--p)"/></svg>`;
}

    rk.forEach(x => { const o = sm[x.siswa.trim().toLowerCase()] ||= {n:x.siswa, nis:'', jk:'', m:{}}; if (x.nis && !o.nis) o.nis = x.nis; if (x.jk && !o.jk) o.jk = x.jk; (o.m[x.mapel] ||= []); if (x.rata !== null) o.m[x.mapel].push(x.rata); });
    isi = `<div class="noprint"><label>Kelas (wali kelas)</label><select id="ak2">${kl.map(k => `<option ${k === A.kelas ? 'selected' : ''}>${esc(k)}</option>`).join('')}</select></div>
    <div class="top"><h2>Rekap kelas ${esc(A.kelas)} · ${esc(A.periode.replace('|', ' – '))}</h2><button class="g" onclick="print()">Cetak</button></div><div class="sc"><table><tr><th>NIS</th><th>Siswa</th><th>L/P</th>${mp.map(m => `<th>${esc(m)}</th>`).join('')}<th>Rata-rata</th></tr>
    ${Object.values(sm).sort((a, b) => a.n.localeCompare(b.n)).map(o => { const c = mp.map(m => avg(o.m[m] || [])), t = avg(c.filter(z => z !== null)); return `<tr><td>${esc(o.nis)}</td><td>${esc(o.n)}</td><td>${esc(o.jk)}</td>${c.map(z => `<td class="n ${z !== null && z < kktp ? 'bad' : ''}">${f1(z)}</td>`).join('')}<td class="n"><b>${f1(t)}</b></td></tr>`; }).join('')}</table></div>`;
  }
  if (A.tab === 'akun') isi = `<div class="sc"><table><tr><th>Guru</th><th>Terdaftar</th><th></th></tr>${A.guru.map(g => `<tr><td>${esc(g.nama)}</td><td class="m">${esc(String(g.dibuat).slice(0, 10))}</td><td><button class="g" data-r="${g.id}">Reset PIN</button></td></tr>`).join('')}</table></div>`;
  $('#app').innerHTML = `<div class="top"><h1>Admin / wali kelas</h1><button class="g noprint" id="ke">Keluar</button></div>
  <div class="card noprint"><div class="row"><div><label>Periode</label><select id="ap">${A.opsi.map(o => `<option value="${esc(o)}" ${o === A.periode ? 'selected' : ''}>${esc(o.replace('|', ' – '))}</option>`).join('')}</select></div><div style="display:flex;align-items:end"><button id="mm">Muat rekap</button></div></div></div>
  <div class="nav">${[['guru', 'Per guru'], ['kelas', 'Per kelas (wali kelas)'], ['akun', 'Akun guru']].map(([k, v]) => `<button data-v="${k}" class="${A.tab === k ? 'on' : ''}">${v}</button>`).join('')}</div><div class="card">${isi}</div>`;
  $('#ke').onclick = () => { sessionStorage.removeItem('adm'); location.hash = ''; showAuth(); };
  $('#ap').onchange = e => A.periode = e.target.value;
  $('#mm').onclick = async () => { A.rows = (await api('adminRekap', {periode:A.periode})).rows; adminRender(); };
  document.querySelectorAll('.nav button').forEach(b => b.onclick = () => { A.tab = b.dataset.v; adminRender(); });
  if ($('#ak2')) $('#ak2').onchange = e => { A.kelas = e.target.value; adminRender(); };
  document.querySelectorAll('[data-r]').forEach(b => b.onclick = async () => { const p = prompt('PIN baru (min. 4 karakter):'); if (p) { await api('adminReset', {guruId:b.dataset.r, pinBaru:p}); toast('PIN direset'); } });
}

/* ---------- Mulai ---------- */
if (location.hash === '#admin') showAdmin();
else (async function () {
  if (S.gid) { try { pilihPeriode((await api('periods')).periods); return; } catch (e) { localStorage.removeItem('sess'); S = {}; } }
  showAuth();
})();
</script>
</body>
</html>
